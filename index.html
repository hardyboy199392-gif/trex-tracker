<!DOCTYPE html>
<html>
<head>
<title>Test</title>
</head>
<body style="background:black;color:white;">
<h1>Hello World</h1>

<button onclick="add()">+</button>
<span id="count">0</span>

<script>
function add() {
    document.getElementById("count").innerText =
        Number(document.getElementById("count").innerText) + 1;
}
</script>

</body>
</html>
